<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>utsuroi-wallpaper</title>
<meta name="description" content="季節・時間・天気で移ろうライブ壁紙。script 1本と div 1つで、ログイン画面などの背景に。">
<style>
  :root { --fg: #f5f7fb; --muted: rgba(245, 247, 251, .72); --panel: rgba(10, 14, 24, .62); --line: rgba(255, 255, 255, .14); --accent: #ffd38a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0b0f18; color: var(--fg); font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  #bg { position: fixed; inset: 0; }
  main { position: relative; min-height: 100%; display: flex; flex-direction: column; justify-content: flex-end; padding: 16px; }
  .panel { width: min(760px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 22px 24px; box-shadow: 0 20px 60px rgba(0, 0, 0, .35); }
  h1 { margin: 0; font-size: clamp(28px, 5vw, 44px); letter-spacing: .02em; font-weight: 700; }
  h1 small { display: block; font-size: 14px; font-weight: 500; color: var(--muted); letter-spacing: .08em; margin-top: 4px; }
  p.lead { margin: 12px 0 16px; color: var(--muted); line-height: 1.7; font-size: 14px; }
  .themes { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 16px; }
  .themes button { appearance: none; border: 1px solid var(--line); background: rgba(255, 255, 255, .06); color: var(--fg); border-radius: 999px; padding: 6px 14px; font: inherit; font-size: 13px; cursor: pointer; }
  .themes button[aria-pressed="true"] { background: var(--fg); color: #111; border-color: var(--fg); }
  pre { margin: 0; background: rgba(0, 0, 0, .45); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; overflow-x: auto; font-size: 12.5px; line-height: 1.6; }
  code { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 14px; }
  .row a, .row button { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; color: #111; background: var(--accent); border: 0; border-radius: 10px; padding: 9px 16px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
  .row a.ghost, .row button.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
  .meta { margin-top: 12px; font-size: 12px; color: var(--muted); }
  @media (max-width: 520px) { .panel { padding: 18px; } pre { font-size: 11.5px; } }
</style>
</head>
<body>
<div id="bg" data-utsuroi="harbor" data-weather="auto"></div>
<main>
  <section class="panel">
    <h1>utsuroi-wallpaper<small>移ろい ― 季節・時間・天気で移ろうライブ壁紙</small></h1>
    <p class="lead">この背景は、いまの時刻・季節・天気(神戸)で描いています。朝焼けから夜空まで、桜から雪まで、絵はゆっくり移り変わります。<br>
      太陽と月は計算どおりの位置に、雨や雪は実際の天気に合わせて重なります。script 1本と div 1つで使えます。</p>
    <div class="themes" id="themes" role="group" aria-label="テーマ"></div>
    <pre><code id="snippet"></code></pre>
    <div class="row">
      <button id="copy">コードをコピー</button>
      <a class="ghost" href="demo/">時刻・季節・天気を動かすデモ</a>
      <a class="ghost" href="https://github.com/kobesoft-labs/utsuroi-wallpaper">GitHub</a>
    </div>
    <div class="meta">BSD-3-Clause · 地球の地図: NASA Earth Observatory · 背景画像は OpenAI の画像生成で作成</div>
  </section>
</main>
<script src="dist/utsuroi.min.js"></script>
<script>
  (function () {
    var CDN = 'https://cdn.jsdelivr.net/gh/kobesoft-labs/utsuroi-wallpaper@1/dist/utsuroi.min.js';
    var bg = document.getElementById('bg'), box = document.getElementById('themes'), code = document.getElementById('snippet'), current = 'harbor';
    function snippet() { return '<div data-utsuroi="' + current + '" style="height:100vh"></div>\n<script src="' + CDN + '"><\/script>'; }
    function render() {
      code.textContent = snippet();
      Array.prototype.forEach.call(box.children, function (b) { b.setAttribute('aria-pressed', b.dataset.id === current ? 'true' : 'false'); });
    }
    Object.keys(Utsuroi.themes).forEach(function (id) {
      var b = document.createElement('button'); b.type = 'button'; b.dataset.id = id; b.textContent = Utsuroi.themes[id].name;
      b.onclick = function () { current = id; if (bg.__lw) bg.__lw.setTheme(id); render(); };
      box.appendChild(b);
    });
    document.getElementById('copy').onclick = function () {
      var t = snippet(), btn = this;
      (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { btn.textContent = 'コピーしました'; setTimeout(function () { btn.textContent = 'コードをコピー'; }, 1600); }, function () { });
    };
    render();
  })();
</script>
</body>
</html>
